- id: T14
  type: normale
  fiches_attendues: [KB-04, KB-02]
  traits: [langue_anglais, plusieurs_demandes, ligne_cachee, reponse_absente]
  question: |
    Hi, I moved to Lausanne from Toronto 3 years ago and I work full time for a bank. Since March I also do some freelance UX work on the side, about 6000 CHF this year. Do I need to register as self-employed and pay AVS on this? Also we will probably move back to Canada in 2028 - will I get my AVS contributions back when I leave? Thanks!
  reponse_reference: |
    Your freelance work is a self-employed side activity, and it is the compensation office that recognises self-employed status. Side self-employed income up to CHF 2,500 a year is only subject to contributions if you ask; at around CHF 6,000, contributions are due, so please register this activity with the compensation office, which will calculate the amount. About getting your contributions back when you leave Switzerland: I don't have reliable information on this. An advisor can help, and for people living abroad the Swiss Compensation Office's website (www.cdc.admin.ch) is the reference. I can open a ticket for you.
  points_cles:
    - répond en anglais
    - activité indépendante accessoire, statut reconnu par la caisse
    - au-delà de 2500 francs par an, cotisations dues, sans montant inventé
    - aucune règle de remboursement inventée
    - passage de main ou renvoi vers la Caisse suisse de compensation

- id: T15
  type: normale
  fiches_attendues: [KB-09, KB-10]
  traits: [langue_allemand, relance, ton_exigeant, passage_de_main]
  question: |
    Guten Tag, das ist jetzt meine dritte Nachricht!!! Unsere Lohnmeldung per ELM wird seit zwei Wochen abgelehnt (Fehlermeldung: Abrechnungsnummer unbekannt) und niemand antwortet uns. Wir sind eine kleine Firma in Freiburg und haben keine Zeit für so etwas. Was ist der Status unseres Tickets? Freundliche Grüsse, R. Keller
  reponse_reference: |
    Guten Tag, es tut mir leid, dass Sie so lange auf eine Antwort warten. Den Stand früherer Anfragen kann ich leider nicht einsehen. Zur Fehlermeldung «Abrechnungsnummer unbekannt»: Bitte prüfen Sie im AHV-Versicherungsprofil Ihrer Lohnsoftware die Abrechnungsnummer und die Nummer der Ausgleichskasse; beide stehen auf unseren Briefen. Alternativ können Sie die Lohnmeldung über unser Online-Portal einreichen. Ich eröffne jetzt ein Ticket für den Arbeitgeber-Support mit dem Hinweis, dass es Ihre dritte Nachricht ist. Bitte nennen Sie mir noch den Namen Ihrer Lohnsoftware und den Zeitpunkt des letzten Versuchs. Telefonisch erreichen Sie uns Montag bis Freitag von 8 bis 12 Uhr und von 13.30 bis 17 Uhr.
  points_cles:
    - répond en allemand
    - s'excuse sans inventer de statut de ticket
    - numéro d'affilié et numéro de caisse à vérifier dans le logiciel
    - portail en solution de secours
