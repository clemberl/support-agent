  type: normale
  fiches_attendues: [KB-10, KB-08, KB-09]
  traits: [urgence, ton_colere, majuscules, menace, passage_de_main]
  question: |
    URGENT URGENT !!! plus personne ne peut se connecter a votre portail depuis ce matin 8h, ni moi ni ma collegue, ca tourne dans le vide puis erreur. LA DECLARATION DES SALAIRES DOIT PARTIR AVANT LE 30 ET ON EST LE 29!!! si on a des interets de retard a cause de vous je ne paierai pas. je veux quelqu'un au telephone tout de suite pas un robot
  reponse_reference: |
    Je comprends l'urgence et je vous passe tout de suite à un conseiller. J'ouvre un ticket de priorité haute, pour connexion impossible et échéance de la déclaration : un conseiller vous contactera le jour ouvrable même. À quel numéro ou à quelle adresse souhaitez-vous être rappelée ? Vous pouvez aussi appeler la caisse dès maintenant, du lundi au vendredi, de 8 h à 12 h et de 13 h 30 à 17 h ; le numéro figure sur le site et sur nos courriers. Si vous utilisez un logiciel de salaires certifié Swissdec, l'envoi par ELM ne passe pas par le portail. Pour les intérêts de retard, c'est le conseiller qui examinera votre situation.
