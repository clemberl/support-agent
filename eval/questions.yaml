# Banc de questions v1 - agent de support de la caisse type (AGT-19, 19/11/2026)
#
# Chaque entrée est un ticket réaliste d'usager (assuré ou employeur) de la caisse type,
# fictive. La réponse de référence et les points clés forment le corrigé : ils servent
# à noter l'agent et ne vont jamais dans la base de connaissances (kb/).
#
# Champs :
#   id                 identifiant du ticket (T01 à T20)
#   type               normale | hors_sujet | piege
#   fiches_attendues   fiches de kb/ qui contiennent la réponse, fiche principale en premier
#                      (liste vide si la réponse n'est dans aucune fiche)
#   traits             difficultés du ticket, pour lire les résultats par type de difficulté
#   question           le ticket, tel que l'usager l'écrit
#   reponse_reference  la réponse attendue (corrigé)
#   points_cles        ce qui doit figurer dans une bonne réponse (barème)
#
# Grille de notation (0-1-2) :
#   2 = tous les points clés, rien de faux ni d'inventé, bonne fiche citée
#   1 = au moins un point clé manquant, mais rien de faux
#   0 = une erreur, une invention, une mauvaise fiche, ou pas de passage de main
#       alors qu'il en fallait un
#
# Hypothèse du banc (à confirmer au Sprint Planning du 2/12) : l'agent répond dans la
# langue de l'usager, en citant des fiches rédigées en français.
# Les numéros AVS et IBAN des tickets sont fictifs.

- id: T01
  type: normale
  fiches_attendues: [KB-01, KB-06, KB-02]
  traits: [plusieurs_demandes, synthese_multi_fiches, chiffre_a_verifier, passage_de_main, sans_accents]
  question: |
    Bonjour, j'ai 62 ans et je commence a en avoir marre de mon boulot donc je pense arreter l'annee prochaine a 63 ans. Ma question c'est de combien ma rente sera diminuée, j'ai lu sur internet 6,8% par an, c'est toujours ca en 2027 ou ca change ? Autre chose j'ai travaillé 4 ans en France dans les annees 90 avant de venir en Suisse, est ce que ca fait un trou et est-ce que je vais perdre de l'argent a cause de ca. Et ma femme a 60 ans, elle voudrait partir en meme temps que moi, elle peut ? On touchera deux rentes complètes ou il y a une limite pour les couples ? Merci d'avance
  reponse_reference: |
    Anticipation : possible au plus tôt dès le premier jour du mois qui suit vos 63 ans. La réduction est à vie : 6,8 % par année d'anticipation selon les taux 2026, soit 13,6 % pour deux ans. La loi prévoit d'adapter ces taux au plus tôt dès 2027 : je ne peux donc pas vous confirmer le taux 2027, vérifiez-le avant de déposer votre demande, 3 à 4 mois avant le début souhaité. Vous resterez tenu de cotiser à l'AVS jusqu'à 65 ans.
    Années en France : des années hors de Suisse peuvent laisser une lacune dans l'AVS. Commencez par demander votre extrait de compte individuel, qui est gratuit. Les périodes à l'étranger doivent être examinées par un conseiller : j'ouvre un ticket.
    Votre épouse : née en 1966, elle peut anticiper dès 62 ans, car elle fait partie des femmes nées entre 1961 et 1969, avec des taux de réduction plus favorables qui dépendent de son revenu. Elle ne pourra donc pas partir en même temps que vous en 2027, mais au plus tôt en 2028. Son âge de référence est de 65 ans.
    Couple : vos deux rentes additionnées ne peuvent pas dépasser 150 % de la rente maximale, soit 3780 francs par mois en 2026.
  points_cles:
    - anticipation possible dès 63 ans
    - réduction à vie de 6,8 % par an (taux 2026), taux 2027 non confirmé
    - demande 3 à 4 mois avant le début souhaité
    - cotisations dues jusqu'à 65 ans
    - années en France : extrait de compte et examen par un conseiller
    - épouse : anticipation dès 62 ans (née entre 1961 et 1969), donc pas avant 2028
    - plafond du couple à 150 % de la rente maximale

- id: T02
  type: normale
  fiches_attendues: [KB-02, KB-03, KB-10]
  traits: [ton_deuil, ligne_cachee, reponse_absente, passage_de_main]
  question: |
    Bonjour, je vous écris pour mon mari, il est décédé le 2 novembre. Il touchait sa rente AVS depuis 6 ans. Je ne sais pas trop comment ca marche, est ce que je dois vous rembourser la rente de novembre qui est arrivée sur notre compte? Et on m'a dit qu'il y avait une 13e rente en décembre cette année, est ce qu'elle sera quand même versée? Et moi je n'ai que ma petite rente, est-ce que j'ai droit à quelque chose maintenant? Excusez moi si ce n'est pas clair, c'est difficile en ce moment.
  reponse_reference: |
    Toutes mes condoléances, et ne vous excusez pas, votre message est clair.
    La rente de novembre : vous n'avez pas à la rembourser. Le droit à la rente s'éteint à la fin du mois du décès, donc la rente de novembre était due.
    La 13e rente : elle n'est versée qu'aux personnes en vie le 1er décembre. Je suis désolé, elle ne sera donc pas versée pour votre mari.
    Vos propres droits : je n'ai pas d'information fiable sur la situation des conjoints survivants. Un conseiller doit l'examiner avec vous. J'ouvre un ticket pour le service des rentes : préférez-vous être contactée par téléphone ou par e-mail ?
  points_cles:
    - ton doux et condoléances
    - pas de remboursement de la rente de novembre (droit jusqu'à la fin du mois du décès)
    - pas de 13e rente pour le mari (il faut être en vie le 1er décembre)
    - aucun droit de veuve inventé, passage de main
    - numéro AVS non demandé

- id: T03
  type: normale
  fiches_attendues: [KB-03]
  traits: [affirmation_fausse, ton_colere, sans_accents, calcul]
  question: |
    bonjour ma rente a commence en aout. mon voisin a deja touche sa 13eme rente le mois passe il me dit et moi rien du tout!!! cest quoi ce bordel vous m'avez oublie ou quoi. et elle sera pareille que mes autres rentes? jai 2140 par mois
  reponse_reference: |
    Je comprends votre inquiétude, mais personne n'a encore reçu la 13e rente : le premier versement a lieu en décembre 2026, avec la rente de décembre. L'information de votre voisin ne peut donc pas être juste. Vous la recevrez automatiquement, sans rien demander, si vous êtes en vie le 1er décembre. Elle vaut un douzième des rentes versées dans l'année. Pour vous, d'août à décembre, cela fait 5 × 2140 / 12, soit environ 892 francs, et non une rente complète. Elle est imposable.
  points_cles:
    - corrige l'idée fausse sans accuser personne (premier versement en décembre 2026)
    - versement automatique, sans demande
    - 5/12 d'une rente mensuelle, soit environ 892 francs
    - ton calme face à la colère

- id: T04
  type: normale
  fiches_attendues: [KB-04, KB-08]
  traits: [plusieurs_demandes, ligne_cachee, chiffre_juste_usager, sans_accents, technique_portail]
  question: |
    Bonjour, je vais me lancer comme graphiste independante a partir de janvier (j'ai encore mon job salarie jusqu'a fin decembre), je pense faire environ 40000.- la premiere annee. Combien je vais payer d'AVS et quand? Sur un forum ils disent que le minimum passe a 541 francs l'an prochain, c'est juste? Aussi cette annee je fais deja des petits mandats a cote de mon job, genre 1800 francs en tout, est-ce que je dois declarer ca chez vous et payer dessus? Et dernier truc votre lien pour activer mon compte sur le portail ne marche pas il me dit expire, ca fait 3 fois que je recommence. merci
  reponse_reference: |
    Cotisations : sous 60 500 francs de revenu, c'est le barème dégressif qui s'applique (en 2026, de 5,371 % à 9,321 % entre 10 100 et 60 500 francs). Le barème 2027 n'est pas confirmé dans mes sources : la caisse vous communiquera le taux exact. Elle fixera des acomptes sur votre revenu estimé, payables chaque trimestre dans les 10 jours qui suivent la fin du trimestre, le premier au plus tard le 10 avril 2027. Le décompte définitif suit la taxation fiscale. C'est la caisse qui reconnaît le statut d'indépendant. Comme indépendante, vous ne serez assurée ni contre le chômage ni contre les accidents.
    Le minimum de 541 francs : c'est exact, dès le 1er janvier 2027 (530 francs en 2026).
    Les petits mandats : une activité indépendante accessoire jusqu'à 2500 francs par an n'est soumise aux cotisations que si vous le demandez.
    Le lien expiré : un seul lien est valable à la fois. Utilisez uniquement celui du dernier e-mail reçu. Si ça ne fonctionne toujours pas, j'ouvre un ticket pour le support du portail.
  points_cles:
    - barème dégressif, aucun taux 2027 inventé
    - minimum de 541 francs en 2027 confirmé (l'usagère a raison)
    - acomptes trimestriels et décompte définitif selon la taxation
    - activité accessoire jusqu'à 2500 francs par an, cotisations seulement sur demande
    - seul le dernier lien reçu est valable
    - pas d'assurance chômage ni accidents pour une indépendante

- id: T05
  type: normale
  fiches_attendues: [KB-05]
  traits: [deux_sens, ligne_cachee, sans_accents, detail_sans_rapport]
  question: |
    bonjour depuis que jai arrete de travailler en juin (j'ai 61 ans, retraite anticipee de ma caisse de pension) je paie plus l avs c normal? ma femme travaille encore a 50% dans une creche. on a vendu notre appartement debut decembre pour aller en location, est ce que ca change quelque chose pour vous? cordialement
  reponse_reference: |
    « Je paie plus l'AVS » peut vouloir dire que vous ne payez plus rien, ou que vous payez davantage. Pouvez-vous me préciser ? Voici déjà les deux cas.
    Si vous ne payez plus rien : jusqu'à l'âge de référence, vous devez cotiser comme personne sans activité lucrative. Exception : si votre épouse, qui travaille, paie au moins 1060 francs de cotisations par an (montant 2026), vous êtes dispensé. C'est la caisse qui vérifie.
    Si vous payez davantage : c'est possible, car la cotisation se calcule sur la fortune plus les rentes annuelles multipliées par 20, y compris la rente de votre caisse de pension.
    La vente de l'appartement : c'est la fortune au 31 décembre qui compte, d'après la taxation fiscale. Si la vente change nettement votre fortune, annoncez-le à la caisse, par exemple sur le portail, pour éviter des intérêts moratoires.
    Votre caisse : comme vous êtes parti à 58 ans ou plus, vous restez affilié à votre caisse précédente.
  points_cles:
    - repère l'ambiguïté et demande une précision, ou traite les deux sens explicitement
    - dispense si l'épouse paie au moins 1060 francs de cotisations par an
    - sinon, cotisation obligatoire jusqu'à l'âge de référence
    - fortune prise en compte au 31 décembre
    - annoncer le changement à la caisse

- id: T06
  type: normale
  fiches_attendues: [KB-06]
  traits: [faux_bug, donnee_personnelle, ligne_cachee, ton_exigeant, plusieurs_demandes]
  question: |
    BUG sur l'extrait de compte. Bonjour j'ai commandé mon extrait en mars sur avs-ai.ch (numero avs 756.0000.0000.00 si ca peut aider) et mes salaires de cette annee n'apparaissent pas du tout alors que mon employeur paie bien chaque mois, je vois les retenues sur mes fiches de salaire. Donc soit il ne vous verse pas soit votre systeme bug. Autre chose en regardant j'ai vu qu'il manque 6 mois en 2023 chez mon ancien employeur, je peux encore faire corriger ou c'est trop tard ? Merci de corriger rapidement
  reponse_reference: |
    Vos salaires de cette année : ce n'est pas une erreur. Les revenus de l'année en cours n'apparaissent que sur l'extrait de l'année suivante. Vos salaires 2026 figureront sur un extrait demandé en 2027.
    Les 6 mois de 2023 : le délai de 30 jours pour contester après réception de l'extrait est passé. Une rectification reste possible si l'erreur est manifeste ou entièrement prouvée, et elle se fera au moment de demander une prestation. Gardez vos fiches de salaire de 2023. Un revenu d'employeur manquant doit être examiné par la caisse : j'ouvre un ticket pour le service des cotisations.
    Votre numéro AVS : pour votre sécurité, ne l'indiquez pas dans ce chat. Le conseiller vous identifiera.
  points_cles:
    - pas de bug (revenus de l'année en cours sur l'extrait de l'année suivante)
    - délai de 30 jours dépassé
    - rectification encore possible si l'erreur est prouvée (garder les fiches de salaire)
    - ticket pour le service des cotisations
    - numéro AVS non répété, avec le conseil de ne pas le donner

- id: T07
  type: normale
  fiches_attendues: [KB-07]
  traits: [vocabulaire_ancien, regle_cantonale, plusieurs_demandes, ton_familier, ligne_cachee]
  question: |
    Salut, ma copine accouche fin fevrier, on habite a Lausanne. Je voulais savoir pour l'allocation paternité combien de jours j'ai et si je peux les prendre un par un, genre tous les vendredis ? Et ma copine elle aura 16 semaines comme sa soeur à Genève ou c'est différent ici ? Elle est indépendante (coiffeuse) ca change quelque chose ?
  reponse_reference: |
    Votre congé, l'allocation à l'autre parent : deux semaines, soit dix jours de travail pour un temps plein (14 indemnités au plus). Vous les prenez dans les six mois qui suivent la naissance, en bloc ou en jours isolés : dix vendredis, c'est possible. L'indemnité vaut 80 % de votre revenu, au maximum 220 francs par jour. Conditions : être le père légal de l'enfant, avoir été assuré à l'AVS pendant les neuf mois avant la naissance et avoir travaillé au moins cinq mois durant cette période. La demande se fait avec le formulaire 318.747, par votre employeur.
    Le congé de votre compagne : la règle fédérale prévoit 14 semaines (98 jours). Certains cantons, comme Genève, ajoutent une prestation cantonale, d'où les 16 semaines de sa sœur. Pour le canton de Vaud, je n'ai pas l'information : renseignez-vous auprès de l'organisme cantonal, ou demandez un conseiller.
    Comme indépendante : elle y a droit aux mêmes conditions d'assurance et d'activité. Elle dépose la demande directement auprès de sa caisse de compensation, avec le formulaire 318.750. Le maximum de 220 francs par jour est atteint dès 99 000 francs de revenu annuel.
  points_cles:
    - dix jours, dans les six mois, en bloc ou en jours isolés (les vendredis, c'est possible)
    - 80 % du revenu, au maximum 220 francs par jour
    - condition du père légal
    - 14 semaines au niveau fédéral, les 16 semaines de Genève sont cantonales
    - rien d'inventé pour le canton de Vaud
    - l'indépendante dépose elle-même sa demande à sa caisse

- id: T08
  type: normale
  fiches_attendues: [KB-09, KB-08]
  traits: [question_naive, regression_possible, capture_coupee, incident_sans_lien, reponse_absente, plusieurs_demandes]
  question: |
    Bonjour, je suis responsable RH dans une PME de 12 personnes, je fais la déclaration des salaires sur votre portail pour la premiere fois (avant c'etait notre fiduciaire). J'ai rempli tous les collaborateurs mais il n'y a pas de bouton suivant ou valider en bas de la page, je suis bloquée. C'est normal ? Je dois faire comment ? Je vous mets une capture du bouton [capture : un bouton « Enregistrer » seul]. Par ailleurs hier soir vers 22h j'avais une erreur 404 en me connectant, vous aviez fait une mise a jour ? Merci de votre aide.
  reponse_reference: |
    Le bouton manquant : je n'ai pas le détail de cet écran, je ne veux donc pas vous donner une consigne au hasard. Il peut s'agir d'une étape qui n'apparaît pas où vous l'attendez, ou d'un vrai dysfonctionnement. Pour que le support tranche vite, envoyez les étapes que vous avez suivies, ce que vous attendiez et ce qui s'affiche réellement, et une capture de l'écran entier, pas seulement du bouton, en masquant les salaires et les noms. J'ouvre ensuite un ticket pour le support employeurs.
    L'erreur 404 d'hier soir : je ne sais pas si une intervention a eu lieu. Les interruptions prévues sont annoncées sur la page de connexion. Si l'erreur revient, notez l'heure, le navigateur et le message exact, et je les ajoute au ticket.
  points_cles:
    - n'invente aucun bouton ni aucun écran
    - ne conclut pas à une erreur de l'usagère (une régression est possible)
    - demande les étapes, le résultat attendu, le résultat actuel et une capture plein écran sans données personnelles
    - erreur 404 : ne sait pas, renvoie à l'annonce de maintenance sur la page de connexion
    - ticket pour le support employeurs

- id: T09
  type: normale
  fiches_attendues: [KB-09]
  traits: [une_phrase, expert_sans_contexte, ligne_cachee]
  question: |
    Franchise rentiers AVS : on l'applique par mois ou par an, et pour un rentier qui a deux employeurs elle s'applique deux fois ?
  reponse_reference: |
    La franchise est de 1400 francs par mois ou de 16 800 francs par an. Elle s'applique par employeur : avec deux employeurs, chacun l'applique sur le salaire qu'il verse. Pour un rentier AVS, il n'y a plus de cotisation à l'assurance-chômage.
  points_cles:
    - 1400 francs par mois ou 16 800 francs par an
    - par employeur, donc deux fois avec deux employeurs
    - pas de cotisation à l'assurance-chômage
    - réponse courte, sans question inutile

