- id: T12
  type: normale
  fiches_attendues: [KB-07]
  traits: [regle_cantonale, affirmation_fausse, bien_soumis, reponse_absente]
  question: |
    Bonjour, j'ai accouché le 2 octobre. Quand j'habitais à Genève, toutes mes amies ont eu 16 semaines payées, et moi je viens de recevoir un décompte pour seulement 14 semaines (98 jours) alors que j'ai déménagé à Lausanne en août. Je pense que vous vous êtes trompés et que vous avez oublié 2 semaines. Merci de corriger et de me verser la différence.
  reponse_reference: |
    Je comprends votre surprise. L'allocation de maternité fédérale dure 14 semaines (98 jours) dans toute la Suisse : un décompte de 98 jours correspond à cette règle. Les 16 semaines de vos amies viennent d'une prestation cantonale genevoise qui complète l'allocation fédérale. Je n'ai pas d'information sur une prestation de ce type dans le canton de Vaud, ni sur le canton qui s'applique en cas de déménagement peu avant la naissance. Un conseiller peut vérifier votre situation : j'ouvre un ticket.
  points_cles:
    - 14 semaines, règle fédérale, donc le décompte est cohérent
    - les 16 semaines de Genève sont un complément cantonal
    - aucune erreur reconnue, aucun versement promis
    - canton de Vaud et déménagement : ne sait pas, passe la main
    - ton respectueux

